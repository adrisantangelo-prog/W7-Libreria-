<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-libreria — Settimana VII Giorno III</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header class="site-header">
      <h1>La mia libreria</h1>
      <p>Aggiungi i tuoi libri e segnali come letti.</p>
    </header>

    <main class="container">

      <!-- Giorno III: ricerca su Open Library -->
      <section class="cerca-section">
        <h2>Cerca</h2>
        <div class="campo">
          <label for="cerca">Cerca su Open Library</label>
          <input type="text" id="cerca" placeholder="es. harari, tolkien…" autocomplete="off">
        </div>

        <div id="spinner" class="spinner" hidden>Caricamento in corso…</div>
        <div id="errore" class="alert alert-danger" hidden></div>

        <ul id="risultati" class="risultati"></ul>
      </section>

      <section class="form-section">
        <h2>Aggiungi un libro</h2>
        <form id="aggiungi-libro" class="form">
          <div class="campo">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo" name="titolo" required>
          </div>
          <div class="campo">
            <label for="autore">Autore</label>
            <input type="text" id="autore" name="autore" required>
          </div>
          <div class="campo">
            <label for="anno">Anno</label>
            <input type="number" id="anno" name="anno" required>
          </div>
          <div class="campo">
            <label for="formato">Formato</label>
            <select id="formato" name="formato">
              <option value="cartaceo">Cartaceo</option>
              <option value="digitale">Digitale</option>
              <!-- EXTRA 15 -->
              <option value="audio">Audio</option>
            </select>
          </div>
          <div class="campo campo-condizionale" id="campo-dimensione" hidden>
            <label for="dimensioneMb">Dimensione MB</label>
            <input type="number" step="0.1" id="dimensioneMb" name="dimensioneMb">
          </div>
          <!-- EXTRA 15 -->
          <div class="campo campo-condizionale" id="campo-durata" hidden>
            <label for="durataMinuti">Durata (minuti)</label>
            <input type="number" id="durataMinuti" name="durataMinuti">
          </div>

          <button type="submit" class="btn-primary">Aggiungi</button>
        </form>
      </section>

      <section class="lista-section">
        <div class="lista-header">
          <h2>I tuoi libri (<span id="contatore">0</span>)</h2>
          <div class="header-azioni">
            <!-- EXTRA 16 -->
            <button type="button" id="esporta" class="btn-secondario">Esporta</button>
            <button type="button" id="svuota-tutto" class="btn-svuota">Svuota tutto</button>
          </div>
        </div>
        <p class="info-storage">I libri sono salvati nel browser e sopravvivono al refresh.</p>

        <!-- EXTRA 17 e 18 -->
        <div class="strumenti">
          <div id="filtri" class="filtri">
            <button type="button" data-filtro="tutti" class="attivo">Tutti</button>
            <button type="button" data-filtro="letti">Letti</button>
            <button type="button" data-filtro="da-leggere">Da leggere</button>
          </div>
          <label class="ordina">
            Ordina per
            <select id="ordina">
              <option value="nessuno">Inserimento</option>
              <option value="titolo">Titolo</option>
              <option value="anno">Anno</option>
            </select>
          </label>
        </div>

        <ul id="lista-libri">
          <!-- popolato da JavaScript -->
        </ul>
      </section>

    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
